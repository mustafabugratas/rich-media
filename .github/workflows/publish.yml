# Posts the due entries of schedule.json with publish.mjs: hourly from 17:40
# to 22:40 UTC (entries are due at 17:30 UTC), one post per run, never within
# 12 hours of the account's newest post, and records each post in
# posted.json. IG_TOKEN_RICH is the account's long-lived Instagram API token
# (repo secret); it expires 60 days after it was generated. By hand with
# "Run workflow", where "check" verifies the token.
name: publish

on:
  schedule:
    - cron: "40 17-22 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "post, check (token) or dry-run"
        default: check
        type: choice
        options: [check, dry-run, post]
      min_gap:
        description: "hours since the newest post below which nothing is posted (0 to post anyway)"
        default: "12"

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN_RICH }}
          IG_EXPECT: richunderoneroof
          IG_MIN_GAP_H: ${{ github.event_name == 'schedule' && '12' || inputs.min_gap }}
          MODE: ${{ github.event_name == 'schedule' && 'post' || inputs.mode }}
        run: |
          if [ -z "$IG_TOKEN" ]; then echo "IG_TOKEN_RICH is not set; nothing posted"; exit 0; fi
          case "$MODE" in
            check) node publish.mjs --check ;;
            dry-run) node publish.mjs --dry-run ;;
            *) node publish.mjs ;;
          esac
      - name: Record what was posted
        if: always()
        run: |
          git diff --quiet posted.json && exit 0
          git config user.name "publish"
          git config user.email "actions@github.com"
          git add posted.json
          git commit -m "Record posted entries"
          git pull --rebase
          git push
